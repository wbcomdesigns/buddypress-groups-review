# Deploys a published GitHub Release to WordPress.org SVN.
# Ships the exact zip attached to the release (the one QA tested), creates
# tags/X.Y.Z, updates trunk and syncs .wordpress-org/ to SVN assets.
# Re-cutting the same tag before publishing is safe: nothing runs until
# the release is published.
# Secrets: SVN_USERNAME, SVN_PASSWORD (WordPress.org login), org-level.
name: Deploy to WordPress.org

on:
  release:
    types: [published]

env:
  SLUG: review-buddypress-groups

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Unpack the release zip
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release download "$TAG" --pattern '*.zip' --dir release-zip
          test "$(find release-zip -maxdepth 1 -name '*.zip' | wc -l)" -eq 1 || { echo "::error::Release must have exactly one zip"; exit 1; }
          unzip -q release-zip/*.zip -d release-zip/unpacked
          dir="$(find release-zip/unpacked -mindepth 1 -maxdepth 1 -type d | head -1)"
          version="${TAG#v}"
          stable="$(grep -iE '^Stable tag:' "$dir/readme.txt" | sed -E 's/^[^:]+:[[:space:]]*//' | tr -d '\r')"
          header="$(grep -iE '^[[:space:]*]*Version:' "$dir"/*.php | head -1 | sed -E 's/.*Version:[[:space:]]*//' | tr -d '\r')"
          echo "tag=$version stable=$stable header=$header"
          [ "$stable" = "$version" ] || { echo "::error::readme Stable tag ($stable) does not match release $version"; exit 1; }
          [ "$header" = "$version" ] || { echo "::error::plugin header Version ($header) does not match release $version"; exit 1; }
          echo "BUILD_DIR=$dir" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Deploy to WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # stable, 2026-11-03
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
